name: Bug Report
description: Create a report to help us improve Lomi for Windows
title: "[BUG] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Lomi Version
      description: What version of Lomi are you running?
      placeholder: "e.g., 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows Version
      options:
        - Windows 10
        - Windows 11
        - Windows Server 2022
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
