[package]
name = "lomi-win"
version = "0.1.0"
edition = "2021"
description = "LOMI for Windows: LLM Optimization & Model Improver"
default-run = "lomi-win"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
chrono = "0.4"
ratatui = "0.26"
crossterm = "0.27"
rand = "0.8.5"
ureq = { version = "2.9", features = ["json"] }
hf-hub = "0.3.2"
memmap2 = "0.9.3"
eframe = "0.27"
tokio = { version = "1.37", features = ["full"] }
walkdir = "2.5.0"
global-hotkey = "0.3"
cpal = "0.15"
enigo = "0.2"
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.19"
dirs = "5.0"
device_query = "2.1.0"
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
tray-item = "0.10.0"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Etw",
    "Win32_Security_Credentials",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_EventLog",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security"
] }
winreg = "0.52"
